name: Publish TechDocs

on:
  push:
    branches:
      - 5.x-dev

jobs:
  publish:
    # Pinned, as the workflow is handed the storage credentials.
    uses: Digitalist-Open-Cloud/BackstageTechDocs/.github/workflows/publish-techdocs.yml@766134ca2a59f1c9d98038a0bdd492d314eacf2f # main
    with:
      entity-name: matomo.plugin.extratools
      entity-kind: Component
      entity-namespace: default
      s3-endpoint: https://hel1.your-objectstorage.com
      bucket-name: backstage
      aws-region: hel1
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
