name: E2E (kind) - branch plugin in matomo-kubernetes

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches: ["5.x-dev"]

permissions:
  contents: read

jobs:
  e2e:
    name: Install chart with branch plugin on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ExtraTools (this branch)
        uses: actions/checkout@v7
        with:
          path: ExtraTools
          persist-credentials: false

      - name: Checkout matomo-kubernetes chart
        uses: actions/checkout@v7
        with:
          repository: Digitalist-Open-Cloud/matomo-kubernetes
          path: matomo-kubernetes
          persist-credentials: false

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Install MariaDB and Valkey
        run: |
          kubectl create namespace matomo
          kubectl apply -f matomo-kubernetes/tests/kind/mariadb.yaml -f matomo-kubernetes/tests/kind/valkey.yaml
          kubectl -n matomo rollout status deployment/matomo-db-mysql --timeout=300s
          kubectl -n matomo rollout status deployment/matomo-valkey --timeout=300s

      # kind nodes are just docker containers, so a hostPath volume lets us drop
      # this branch's plugin tree straight onto the node's filesystem (nested
      # dirs and binaries included) with no configmap/PVC/initContainer
      # plumbing - the same trick this repo already uses for the tagmanager-js
      # RWX PV further down in the upstream workflow this was adapted from.
      # vendor/ is skipped: the matomo image already ships ExtraTools' composer
      # deps, we only want to override the plugin's own PHP/template/lang files.
      - name: Copy branch plugin onto kind node
        run: |
          docker ps -a
          NODE=$(docker ps --filter "name=control-plane" --format '{{.Names}}' | head -1)
          echo "Detected kind node: $NODE"
          if [ -z "$NODE" ]; then
            echo "::error::no control-plane container found"
            exit 1
          fi
          ls -la ExtraTools | head

          # kind mounts /tmp on its node containers as a separate tmpfs, which
          # is a known source of docker-cp weirdness. Try both /tmp and a
          # plain path on the node's regular overlay root, unfolded (no
          # ::group::) so the comparison is always visible in the log.
          set +e
          cp_output=$(docker cp ExtraTools "$NODE":/tmp/extratools-plugin 2>&1)
          cp_status=$?
          set -e
          echo "docker cp to /tmp exit=$cp_status output=${cp_output:-<empty>}"
          docker exec "$NODE" test -d /tmp/extratools-plugin \
            && echo "/tmp/extratools-plugin: EXISTS" || echo "/tmp/extratools-plugin: MISSING"

          set +e
          cp_output2=$(docker cp ExtraTools "$NODE":/root/extratools-plugin 2>&1)
          cp_status2=$?
          set -e
          echo "docker cp to /root exit=$cp_status2 output=${cp_output2:-<empty>}"
          docker exec "$NODE" test -d /root/extratools-plugin \
            && echo "/root/extratools-plugin: EXISTS" || echo "/root/extratools-plugin: MISSING"

          echo "full /tmp listing on node:"
          docker exec "$NODE" ls -la /tmp
          echo "full /root listing on node:"
          docker exec "$NODE" ls -la /root

          if docker exec "$NODE" test -d /root/extratools-plugin; then
            DEST=/root/extratools-plugin
          elif docker exec "$NODE" test -d /tmp/extratools-plugin; then
            DEST=/tmp/extratools-plugin
          else
            echo "::error::plugin copy did not land on the node at either path"
            exit 1
          fi
          echo "Using DEST=$DEST"
          echo "DEST=$DEST" >> "$GITHUB_ENV"

          docker exec "$NODE" rm -rf "$DEST/vendor" "$DEST/tests" "$DEST/.git"
          docker exec "$NODE" chmod -R a+rX "$DEST"
          echo "::group::what actually landed on the node"
          docker exec "$NODE" sh -c "ls -la '$DEST' && echo --- && cat '$DEST/plugin.json'"
          echo "::endgroup::"

      - name: Write plugin-override values
        run: |
          echo "Node-side plugin path: $DEST"
          cat > extratools-override.yaml <<EOF
          # tests/kind/values.yaml turns gatewayApi on for the upstream
          # ingress+Gateway e2e test; we don't install Gateway API CRDs here,
          # so the chart's HTTPRoute resources fail to install unless we
          # explicitly turn it back off.
          matomo:
            gatewayApi:
              enabled: false
          extraVolumes:
            - name: extratools-branch
              hostPath:
                path: $DEST
                type: Directory
          extraVolumeMounts:
            - name: extratools-branch
              mountPath: /var/www/html/plugins/ExtraTools
          EOF
          cat extratools-override.yaml

      - name: Install Matomo chart with branch plugin
        run: |
          helm install matomo matomo-kubernetes/charts/matomo --namespace matomo \
            --values matomo-kubernetes/tests/kind/values.yaml \
            --values extratools-override.yaml

      - name: Wait for Matomo workloads
        run: |
          for d in matomo-dashboard matomo-tracker matomo-cli; do
            echo "::group::rollout $d"
            kubectl -n matomo rollout status "deployment/$d" --timeout=600s
            echo "::endgroup::"
          done

      - name: Show what the pod actually got mounted
        run: |
          echo "::group::rendered volume + mount for the matomo container"
          kubectl -n matomo get deployment matomo-dashboard -o json \
            | jq '.spec.template.spec.volumes, (.spec.template.spec.containers[] | select(.name=="matomo") | .volumeMounts)'
          echo "::endgroup::"
          echo "::group::plugins dir as seen inside the pod"
          kubectl -n matomo exec deployment/matomo-dashboard -c matomo -- \
            sh -c 'ls -la /var/www/html/plugins/ExtraTools 2>&1 || echo MISSING; echo ---; ls -la /var/www/html/plugins | head -5'
          echo "::endgroup::"

      - name: Verify the branch plugin is the one actually mounted
        run: |
          expected=$(grep -m1 '"version"' ExtraTools/plugin.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          actual=$(kubectl -n matomo exec deployment/matomo-dashboard -c matomo -- \
            grep -m1 '"version"' /var/www/html/plugins/ExtraTools/plugin.json | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "expected=$expected actual=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::mounted ExtraTools version ($actual) doesn't match checked-out branch ($expected)"
            exit 1
          fi

      - name: Smoke test dashboard and tracker (in-cluster)
        run: |
          kubectl -n matomo run smoke --rm -i --restart=Never \
            --image=curlimages/curl:8.14.1 --command -- sh -c '
            set -e
            echo "dashboard /index.php"
            curl -sSf -o /dev/null http://matomo-dashboard:8080/index.php
            echo "tracker /matomo.js"
            curl -sSf -o /dev/null http://matomo-tracker:8080/matomo.js
            '

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::resources"
          kubectl get all -n matomo || true
          kubectl -n matomo get events --sort-by=.lastTimestamp | tail -n 50 || true
          echo "::endgroup::"
          for p in $(kubectl -n matomo get pods -o name); do
            echo "::group::$p"
            kubectl -n matomo describe "$p" | tail -n 40 || true
            kubectl -n matomo logs "$p" --all-containers --tail=100 || true
            echo "::endgroup::"
          done
